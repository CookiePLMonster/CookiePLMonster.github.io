<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "ItemList",
    "itemListElement": [

{%- for blogpost in include.items -%}
    {
        "@type": "ListItem",
        "position": {{ forloop.index }},
        "url": "{{ blogpost.url | absolute_url }}"
    } {%- unless forloop.last -%},{%- endunless -%}
{%- endfor -%}
    ]
}
</script>
